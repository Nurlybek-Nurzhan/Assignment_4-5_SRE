apiVersion: v1
kind: Secret
metadata:
  name: microshop-secret
  namespace: microshop
type: Opaque
# SECURITY: Replace values with base64-encoded production secrets before deploying.
# Generate with: echo -n 'your-secret' | base64
# Never commit real secrets to version control.
stringData:
  JWT_SECRET: CHANGE_ME_BEFORE_DEPLOY
  DB_PASS: CHANGE_ME_BEFORE_DEPLOY
  AUTH_PASS_1: CHANGE_ME_BEFORE_DEPLOY
  AUTH_PASS_2: CHANGE_ME_BEFORE_DEPLOY
  GRAFANA_USER: admin
  GRAFANA_PASS: CHANGE_ME_BEFORE_DEPLOY
