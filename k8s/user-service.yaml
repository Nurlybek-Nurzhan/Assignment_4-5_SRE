apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: microshop/user-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microshop-secret
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microshop
spec:
  selector:
    app: user-service
  ports:
    - port: 8004
      targetPort: 8004
