apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: microshop/auth-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microshop-secret
                  key: JWT_SECRET
            - name: AUTH_USER_1
              valueFrom:
                configMapKeyRef:
                  name: microshop-config
                  key: AUTH_USER_1
            - name: AUTH_PASS_1
              valueFrom:
                secretKeyRef:
                  name: microshop-secret
                  key: AUTH_PASS_1
            - name: AUTH_USER_2
              valueFrom:
                configMapKeyRef:
                  name: microshop-config
                  key: AUTH_USER_2
            - name: AUTH_PASS_2
              valueFrom:
                secretKeyRef:
                  name: microshop-secret
                  key: AUTH_PASS_2
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: microshop
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
