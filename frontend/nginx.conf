server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /api/products/ {
        rewrite ^/api/products/(.*)$ /$1 break;
        proxy_pass http://product-service:8002;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /api/orders/ {
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass http://order-service:8003;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /api/users/ {
        rewrite ^/api/users/(.*)$ /$1 break;
        proxy_pass http://user-service:8004;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /api/chat/ {
        rewrite ^/api/chat/(.*)$ /$1 break;
        proxy_pass http://chat-service:8005;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /api/payments/ {
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass http://payment-service:8006;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }
}
