---
- name: Deploy MicroShop SRE Stack
  hosts: microshop_servers
  become: true

  vars:
    repo_url: https://github.com/Nurlybek-Nurzhan/Assignment_4-5_SRE.git
    app_dir: /opt/microshop
    docker_compose_version: "2.24.0"

  tasks:

    - name: Update system packages
      yum:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install required packages
      yum:
        name:
          - docker
          - git
          - python3
          - python3-pip
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: true

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: Verify Docker Compose installation
      command: docker-compose --version
      register: compose_version
      changed_when: false

    - name: Show Docker Compose version
      debug:
        msg: "{{ compose_version.stdout }}"

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Clone or update application repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      become_user: ec2-user

    - name: Copy environment file
      copy:
        src: ../env.production
        dest: "{{ app_dir }}/.env"
        owner: ec2-user
        group: ec2-user
        mode: "0600"
      ignore_errors: true

    - name: Create default .env if not provided
      copy:
        content: |
          JWT_SECRET={{ lookup('env', 'JWT_SECRET') | default('CHANGE_ME_BEFORE_DEPLOY', true) }}
          DB_USER={{ lookup('env', 'DB_USER') | default('postgres', true) }}
          DB_PASS={{ lookup('env', 'DB_PASS') | default('CHANGE_ME_BEFORE_DEPLOY', true) }}
          AUTH_USER_1={{ lookup('env', 'AUTH_USER_1') | default('nurzhan', true) }}
          AUTH_PASS_1={{ lookup('env', 'AUTH_PASS_1') | default('CHANGE_ME_BEFORE_DEPLOY', true) }}
          AUTH_USER_2={{ lookup('env', 'AUTH_USER_2') | default('admin', true) }}
          AUTH_PASS_2={{ lookup('env', 'AUTH_PASS_2') | default('CHANGE_ME_BEFORE_DEPLOY', true) }}
          GRAFANA_USER={{ lookup('env', 'GRAFANA_USER') | default('admin', true) }}
          GRAFANA_PASS={{ lookup('env', 'GRAFANA_PASS') | default('CHANGE_ME_BEFORE_DEPLOY', true) }}
        dest: "{{ app_dir }}/.env"
        owner: ec2-user
        group: ec2-user
        mode: "0600"
        force: false

    - name: Pull latest Docker images
      command: docker-compose pull
      args:
        chdir: "{{ app_dir }}"
      become_user: ec2-user
      ignore_errors: true

    - name: Build Docker images
      command: docker-compose build --no-cache
      args:
        chdir: "{{ app_dir }}"
      become_user: ec2-user

    - name: Start application stack
      command: docker-compose up -d
      args:
        chdir: "{{ app_dir }}"
      become_user: ec2-user

    - name: Wait for services to become healthy
      command: docker-compose ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_ps
      until: "'unhealthy' not in compose_ps.stdout and 'starting' not in compose_ps.stdout"
      retries: 12
      delay: 10
      become_user: ec2-user

    - name: Verify frontend is responding
      uri:
        url: http://localhost:80
        status_code: 200
      retries: 5
      delay: 5

    - name: Verify Prometheus is responding
      uri:
        url: http://localhost:9090/-/healthy
        status_code: 200
      retries: 5
      delay: 5

    - name: Verify Grafana is responding
      uri:
        url: http://localhost:3000/api/health
        status_code: 200
      retries: 5
      delay: 5

    - name: Show running containers
      command: docker-compose ps
      args:
        chdir: "{{ app_dir }}"
      become_user: ec2-user
      register: running_containers
      changed_when: false

    - name: Print running containers
      debug:
        msg: "{{ running_containers.stdout_lines }}"

    - name: Deployment complete
      debug:
        msg:
          - "MicroShop deployed successfully!"
          - "Frontend:   http://{{ ansible_host }}:80"
          - "Grafana:    http://{{ ansible_host }}:3000"
          - "Prometheus: http://{{ ansible_host }}:9090"
